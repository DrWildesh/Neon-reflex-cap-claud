name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # Speeds up consecutive builds dramatically

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Prevents redownloading gradle files on every run

      - name: Install Dependencies
        run: npm install

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Inject AdMob App ID
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(path)) {
            let m = fs.readFileSync(path, 'utf8');
            if (!m.includes('com.google.android.gms.ads.APPLICATION_ID')) {
              const metaAdmob = '\n        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>';
              m = m.replace('</application>', metaAdmob + '\n    </application>');
              fs.writeFileSync(path, m, 'utf8');
            }
          }
          "

      - name: Sync Native Assets
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-reflex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Auto Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Neon Reflex build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
