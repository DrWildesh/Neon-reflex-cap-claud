name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'resources/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java Runtime environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Package Dependencies
        run: npm install

      - name: Generate App Icons & Splash Screen Assets
        run: npx @capacitor/assets generate --android

      - name: Build Standard Web Assets Layout
        run: npm run build --if-present

      # 🌟 NEW FIX STEP: Dynamically changes minSdkVersion from 24 to 26 inside Gradle vars
      - name: Patch Native Android Build Variable Parameters
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/variables.gradle';
          if (fs.existsSync(path)) {
            let vars = fs.readFileSync(path, 'utf8');
            vars = vars.replace(/minSdkVersion\s*=\s*\d+/g, 'minSdkVersion = 26');
            fs.writeFileSync(path, vars, 'utf8');
            console.log('Successfully upgraded minSdkVersion parameters to 26.');
          } else {
            console.error('variables.gradle not found at target directory layout.');
          }
          "

      - name: Patch AndroidManifest XML Properties
        run: node -e "const fs = require('fs'); const path = 'android/app/src/main/AndroidManifest.xml'; if (fs.existsSync(path)) { let m = fs.readFileSync(path, 'utf8'); if (!m.includes('android:usesCleartextTraffic')) { m = m.replace('<application', '<application android:usesCleartextTraffic=\"true\"'); } if (!m.includes('com.android.chrome')) { const q = '\n    <queries>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <category android:name=\"android.intent.category.BROWSABLE\" />\n            <data android:scheme=\"https\" />\n        </intent>\n        <package android:name=\"com.android.chrome\" />\n        <package android:name=\"com.android.vending\" />\n    </queries>'; if (m.includes('</manifest>')) { m = m.replace('</manifest>', q + '\n</manifest>'); } } fs.writeFileSync(path, m, 'utf8'); console.log('Manifest patched successfully.'); } else { console.error('Manifest file missing!'); }"

      - name: Sync Compiled Asset Bundles into Android Platform
        run: npx cap sync android

      - name: Compile Native Android Debug Package Binary
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Store Production Binary Artifact Archive
        uses: actions/upload-artifact@v4
        with:
          name: neon-reflex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy Production Release Package Target to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Neon Reflex build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
